<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大麦红利价值</title>
<link rel="stylesheet" href="styles.css?v=2026-09-21-2105">
<script src="echarts.min.js"></script>
<script src="portfolio_data.js?v=2026-09-21-2105"></script>
</head>
<body>
<header>
  <div class="brand">
    <h1 id="title">大麦红利价值</h1>
    <span class="sub" id="subtitle"></span>
  </div>
  <div class="updated">更新 <b id="updated"></b></div>
</header>

<div id="signal" class="signal"></div>

<section class="kpis" id="kpis"></section>
<div id="valueNote" class="hint" style="margin:2px 4px 10px;color:#8b95b5;font-size:12px;line-height:1.55"></div>

<section class="card">
  <div class="card-head"><h2>净值曲线 · 组合 vs 基准</h2><span class="hint" id="navHint">全收益(后复权)口径</span></div>
  <div id="navChart" class="chart-lg"></div>
  <div id="ddChart" class="chart-sm"></div>
</section>

<section class="card" id="fpCard" style="display:none">
  <div class="card-head"><h2>阶段业绩 · 同类排名</h2><span class="hint" id="fpHint"></span></div>
  <table class="tbl fp" id="fundPerf"></table>
  <div id="fpPeers"></div>
  <div id="fpNote" class="hint" style="margin-top:8px;line-height:1.55"></div>
</section>

<div class="grid-2">
  <section class="card">
    <div class="card-head"><h2>月度收益</h2></div>
    <div id="monthChart" class="chart-md"></div>
  </section>
  <section class="card">
    <div class="card-head"><h2>当前持仓</h2><span class="hint" id="holdAsof"></span></div>
    <table class="tbl" id="holdings"></table>
  </section>
</div>

<section class="card" id="eventsCard" style="display:none">
  <div class="card-head"><h2>近期重要事项</h2><span class="hint" id="eventsHint">当前持仓近3月已发生 / 未来1月将至：分红、业绩预告·快报·披露</span></div>
  <div id="eventsBox" class="evts"></div>
</section>

<section class="card">
  <div class="card-head"><h2>历史每月持仓</h2><span class="hint">rqalpha 已实现月末真实持仓；未覆盖月为临时口径，次月自动修正</span></div>
  <div id="histWrap" class="hist"></div>
</section>

<section class="card" id="expoCard" style="display:none">
  <div class="card-head"><h2>因子暴露</h2><span class="hint" id="expoHint">组合持仓在各因子上的全市场 z-score 加权暴露（正=超配该因子方向）</span></div>
  <div id="expoSummary" class="expo-sum"></div>
  <div class="grid-2">
    <div><div id="expoRadar" class="chart-md"></div></div>
    <div><div id="expoHist" class="chart-md"></div></div>
  </div>
  <div id="expoBars" class="chart-lg" style="margin-top:8px"></div>
</section>

<footer id="foot"></footer>
<script src="app.js?v=2026-09-21-2105"></script>
</body>
</html>
